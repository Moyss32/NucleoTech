<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - NucleoTech</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="logo">NucleoTech</div>
        <nav>
            <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/produtos">Produtos</a></li>
            </ul>
        </nav>
        <div id="auth-buttons" class="auth-buttons"></div>
    </header>

    <main>
        <div class="form-container">
            <h2 class="section-title" style="margin-bottom: 1.5rem;">Cadastro</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Nome de Usuário</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Cadastrar</button>
            </form>
            <p style="margin-top: 1.5rem; text-align: center;">Já tem uma conta? <a href="/login" style="color: var(--accent-blue); font-weight: bold;">Faça Login</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 NucleoTech. Todos os direitos reservados.</p>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.ok) {
                    showNotification('Cadastro realizado com sucesso! Faça login.');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    const data = await response.json();
                    showNotification(data.message || 'Erro ao cadastrar.', 'error');
                }
            } catch (error) {
                console.error('Erro ao cadastrar:', error);
                showNotification('Erro de conexão.', 'error');
            }
        });
    </script>
</body>
</html>
