<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - NucleoTech</title>
    <link rel="stylesheet" href="/app/static/css/style.css">
</head>
<body>
    <header>
        <div class="logo">NucleoTech Admin</div>
        <nav>
            <ul>
                <li><a href="/">Voltar ao Site</a></li>
            </ul>
        </nav>
        <div id="auth-buttons" class="auth-buttons"></div>
    </header>

    <main class="admin-container">
        <aside class="admin-sidebar">
            <ul style="display: flex; flex-direction: column; gap: 1rem;">
                <li><button onclick="showSection('products')" class="btn btn-outline" style="width: 100%;">Produtos</button></li>
                <li><button onclick="showSection('users')" class="btn btn-outline" style="width: 100%;">Usuários</button></li>
                <li><button onclick="showSection('orders')" class="btn btn-outline" style="width: 100%;">Pedidos</button></li>
            </ul>
        </aside>

        <section class="admin-content">
            <div id="admin-products" class="admin-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2>Gerenciar Produtos</h2>
                    <button onclick="openProductModal()" class="btn btn-primary">Novo Produto</button>
                </div>
                <div id="products-table-container"></div>
            </div>

            <div id="admin-users" class="admin-section" style="display: none;">
                <h2>Gerenciar Usuários</h2>
                <div id="users-table-container"></div>
            </div>

            <div id="admin-orders" class="admin-section" style="display: none;">
                <h2>Gerenciar Pedidos</h2>
                <div id="orders-table-container"></div>
            </div>
        </section>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div class="form-container" style="background: white; max-width: 600px; width: 90%; margin: 0;">
            <h3 id="modal-title">Novo Produto</h3>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="p-name">Nome</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label for="p-category">Categoria</label>
                    <select id="p-category" required>
                        <option value="Licenças">Licenças</option>
                        <option value="Sistemas Empresariais">Sistemas Empresariais</option>
                        <option value="Ferramentas de Produtividade">Ferramentas de Produtividade</option>
                        <option value="Soluções Tecnológicas">Soluções Tecnológicas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="p-price">Preço (R$)</label>
                    <input type="number" step="0.01" id="p-price" required>
                </div>
                <div class="form-group">
                    <label for="p-desc">Descrição</label>
                    <textarea id="p-desc" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="p-benefits">Benefícios</label>
                    <textarea id="p-benefits" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="p-specs">Especificações</label>
                    <textarea id="p-specs" rows="2"></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Salvar</button>
                    <button type="button" onclick="closeProductModal()" class="btn btn-outline" style="flex: 1;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        async function checkAdmin() {
            const user = await checkAuth();
            if (!user || !user.is_admin) {
                window.location.href = '/';
                return;
            }
            loadProducts();
        }

        function showSection(section) {
            document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
            document.getElementById(`admin-${section}`).style.display = 'block';
            if (section === 'products') loadProducts();
            if (section === 'users') loadUsers();
            if (section === 'orders') loadOrders();
        }

        async function loadProducts() {
            const response = await fetch('/api/products');
            const products = await response.json();
            const container = document.getElementById('products-table-container');
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr>
                                <td>${p.id}</td>
                                <td>${p.name}</td>
                                <td>${p.category}</td>
                                <td>${formatCurrency(p.price)}</td>
                                <td>
                                    <button onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="btn btn-outline" style="padding: 0.2rem 0.5rem;">Editar</button>
                                    <button onclick="deleteProduct(${p.id})" class="btn btn-outline" style="padding: 0.2rem 0.5rem; color: var(--error-red); border-color: var(--error-red);">Excluir</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function loadUsers() {
            const response = await fetch('/api/users');
            const users = await response.json();
            const container = document.getElementById('users-table-container');
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Admin</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(u => `
                            <tr>
                                <td>${u.id}</td>
                                <td>${u.username}</td>
                                <td>${u.email}</td>
                                <td>${u.is_admin ? 'Sim' : 'Não'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function loadOrders() {
            const response = await fetch('/api/orders');
            const orders = await response.json();
            const container = document.getElementById('orders-table-container');
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuário ID</th>
                            <th>Produto ID</th>
                            <th>Data</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${orders.map(o => `
                            <tr>
                                <td>#${o.id}</td>
                                <td>${o.user_id}</td>
                                <td>${o.product_id}</td>
                                <td>${new Date(o.date_ordered).toLocaleDateString()}</td>
                                <td>${o.status}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function openProductModal() {
            document.getElementById('modal-title').innerText = 'Novo Produto';
            document.getElementById('product-id').value = '';
            document.getElementById('product-form').reset();
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        function editProduct(p) {
            document.getElementById('modal-title').innerText = 'Editar Produto';
            document.getElementById('product-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-category').value = p.category;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-desc').value = p.description;
            document.getElementById('p-benefits').value = p.benefits || '';
            document.getElementById('p-specs').value = p.specifications || '';
            document.getElementById('product-modal').style.display = 'flex';
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const data = {
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                price: parseFloat(document.getElementById('p-price').value),
                description: document.getElementById('p-desc').value,
                benefits: document.getElementById('p-benefits').value,
                specifications: document.getElementById('p-specs').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/products/${id}` : '/api/products';

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showNotification('Produto salvo com sucesso!');
                    closeProductModal();
                    loadProducts();
                } else {
                    showNotification('Erro ao salvar produto.', 'error');
                }
            } catch (error) {
                console.error('Erro ao salvar:', error);
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) return;
            try {
                const response = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showNotification('Produto excluído!');
                    loadProducts();
                }
            } catch (error) {
                console.error('Erro ao excluir:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', checkAdmin);
    </script>
</body>
</html>
