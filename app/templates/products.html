<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - NucleoTech</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="logo">NucleoTech</div>
        <nav>
            <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/produtos">Produtos</a></li>
                <li><a href="/#sobre">Sobre</a></li>
            </ul>
        </nav>
        <div id="auth-buttons" class="auth-buttons"></div>
    </header>

    <main>
        <section>
            <h1 class="section-title">Nossos Softwares</h1>
            
            <div style="margin-bottom: 2rem; text-align: center;">
                <label for="category-filter">Filtrar por Categoria:</label>
                <select id="category-filter" onchange="loadProducts(this.value)" style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color);">
                    <option value="">Todas as Categorias</option>
                    <option value="Licenças">Licenças</option>
                    <option value="Sistemas Empresariais">Sistemas Empresariais</option>
                    <option value="Ferramentas de Produtividade">Ferramentas de Produtividade</option>
                    <option value="Soluções Tecnológicas">Soluções Tecnológicas</option>
                </select>
            </div>

            <div id="products-list" class="grid">
                <!-- Dynamic content from JS -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NucleoTech. Todos os direitos reservados.</p>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        async function loadProducts(category = '') {
            try {
                const url = category ? `/api/products?category=${category}` : '/api/products';
                const response = await fetch(url);
                const products = await response.json();
                const container = document.getElementById('products-list');
                
                if (products.length === 0) {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">Nenhum produto encontrado nesta categoria.</p>';
                    return;
                }

                container.innerHTML = products.map(p => `
                    <div class="card">
                        <div style="height: 150px; background-color: var(--secondary-gray); border-radius: 4px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; color: var(--accent-blue); font-weight: bold;">
                            ${p.category}
                        </div>
                        <h3>${p.name}</h3>
                        <p>${p.description.substring(0, 80)}...</p>
                        <p class="price">${formatCurrency(p.price)}</p>
                        <div style="display: flex; gap: 0.5rem;">
                            <a href="/produto/${p.id}" class="btn btn-outline" style="flex: 1; text-align: center;">Detalhes</a>
                            <button onclick="buyProduct(${p.id})" class="btn btn-primary" style="flex: 1;">Comprar</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
            }
        }

        async function buyProduct(productId) {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId })
                });

                if (response.ok) {
                    showNotification('Compra realizada com sucesso! Verifique seu perfil.');
                } else {
                    showNotification('Erro ao processar compra.', 'error');
                }
            } catch (error) {
                console.error('Erro ao comprar:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => loadProducts());
    </script>
</body>
</html>
