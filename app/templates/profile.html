<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - NucleoTech</title>
    <link rel="stylesheet" href="/app/static/css/style.css">
</head>
<body>
    <header>
        <div class="logo">NucleoTech</div>
        <nav>
            <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/produtos">Produtos</a></li>
            </ul>
        </nav>
        <div id="auth-buttons" class="auth-buttons"></div>
    </header>

    <main>
        <section style="max-width: 800px; margin: 0 auto;">
            <h1 class="section-title">Minha Área</h1>
            
            <div class="card" style="margin-bottom: 3rem;">
                <h3>Dados do Usuário</h3>
                <div id="user-info">
                    <!-- Dynamic content -->
                </div>
            </div>

            <h2 style="margin-bottom: 1.5rem; color: var(--accent-blue);">Meus Pedidos</h2>
            <div id="orders-list">
                <!-- Dynamic content -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NucleoTech. Todos os direitos reservados.</p>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        async function loadProfile() {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login';
                return;
            }

            document.getElementById('user-info').innerHTML = `
                <p><strong>Nome:</strong> ${user.username}</p>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Tipo de Conta:</strong> ${user.is_admin ? 'Administrador' : 'Cliente'}</p>
            `;

            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                const container = document.getElementById('orders-list');
                
                if (orders.length === 0) {
                    container.innerHTML = '<p>Você ainda não realizou nenhum pedido.</p>';
                    return;
                }

                // Fetch products to show names
                const prodResponse = await fetch('/api/products');
                const products = await prodResponse.json();
                const prodMap = {};
                products.forEach(p => prodMap[p.id] = p);

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID Pedido</th>
                                <th>Produto</th>
                                <th>Data</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${orders.map(o => `
                                <tr>
                                    <td>#${o.id}</td>
                                    <td>${prodMap[o.product_id] ? prodMap[o.product_id].name : 'Produto Removido'}</td>
                                    <td>${new Date(o.date_ordered).toLocaleDateString()}</td>
                                    <td><span style="color: var(--success-green); font-weight: bold;">${o.status}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('Erro ao carregar pedidos:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
