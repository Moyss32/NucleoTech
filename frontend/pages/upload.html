<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processar Arquivo - NucleoTech</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo">
                <div style="width: 24px; height: 24px; background: var(--primary); border-radius: 4px;"></div>
                NucleoTech
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">🏠 Dashboard</a>
                <a href="tools.html" class="sidebar-link active">🛠️ Ferramentas</a>
                <a href="history.html" class="sidebar-link">📜 Histórico</a>
                <a href="profile.html" class="sidebar-link">👤 Perfil</a>
                <a href="subscription.html" class="sidebar-link">💳 Assinatura</a>
            </nav>
            <div style="margin-top: auto;">
                <button onclick="api.logout()" class="sidebar-link" style="width: 100%; text-align: left; background: none; border: none; cursor: pointer;">🚪 Sair</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>Processar Arquivo</h1>
                <p>Faça o upload e escolha a ferramenta desejada.</p>
            </header>

            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div class="form-group">
                    <label for="tool-select">Ferramenta Selecionada</label>
                    <select id="tool-select" class="btn btn-outline" style="width: 100%; text-align: left; padding: 0.75rem;">
                        <option value="bg-remove">Remover Fundo</option>
                        <option value="img-convert">Converter Imagem</option>
                        <option value="upscale">Upscale 1.5x</option>
                        <option value="thumbnail">Gerador de Thumbnails</option>
                        <option value="audio-convert">Conversor de Áudio</option>
                    </select>
                </div>

                <div id="upload-area" class="upload-area">
                    <i>📁</i>
                    <p>Arraste seu arquivo aqui ou clique para selecionar</p>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">PNG, JPG, WebP, MP3 ou WAV</span>
                    <input type="file" id="file-input" hidden>
                </div>

                <div id="preview-container"></div>

                <div id="progress-container" class="progress-container" style="display: none;">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <button id="process-btn" class="btn btn-primary" style="width: 100%; margin-top: 2rem; padding: 1rem;" disabled>
                    Iniciar Processamento
                </button>
            </div>
        </main>
    </div>

    <div id="notification-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/upload.js"></script>
</body>
</html>
