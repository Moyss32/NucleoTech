<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NucleoTech</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="../assets/logo.png" alt="NucleoTech Logo" style="height: 48px; margin-bottom: 1rem;">
                <h1>Bem-vindo de volta</h1>
                <p>Entre na sua conta NucleoTech</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" required placeholder="Seu usuário">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">Entrar</button>
            </form>
            <div class="auth-footer">
                Não tem uma conta? <a href="register.html">Criar conta</a>
            </div>
        </div>
    </div>

    <div id="notification-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
