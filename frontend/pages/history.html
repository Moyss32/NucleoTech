<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - NucleoTech</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <div class="logo">NucleoTech</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="tools.html">Ferramentas</a>
            <a href="history.html">Histórico</a>
            <a href="#" id="logoutBtn">Sair</a>
        </div>
    </nav>

    <div class="container">
        <h1>Histórico de Processamento</h1>
        <div class="card">
            <p>Aqui você verá o histórico de todos os seus arquivos processados.</p>
            <ul id="historyList">
                <!-- Itens do histórico serão carregados aqui via JavaScript -->
            </ul>
        </div>
    </div>

    <script type="module">
        import auth from "../js/auth.js";

        if (!auth.isAuthenticated()) {
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", (e) => {
            e.preventDefault();
            auth.logout();
        });

        // TODO: Implementar a busca e exibição do histórico de processamento
        // Isso exigirá um novo endpoint no backend para listar o histórico do usuário.
        const historyList = document.getElementById("historyList");
        historyList.innerHTML = "<li>Nenhum histórico disponível ainda.</li>";
    </script>
</body>
</html>
