<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — NucleoTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Syne:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon">
</head>
<body>

  <div class="dashboard-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="home.html" class="logo">
        <img src="../assets/logo.png" alt="NucleoTech Logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="logo-icon-fallback" style="display:none">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="8" fill="#0070f3"/>
            <circle cx="16" cy="16" r="6" stroke="white" stroke-width="2.5" fill="none"/>
          </svg>
        </div>
        <div class="logo-text-wrap">
          <span class="logo-name">NucleoTech</span>
        </div>
      </a>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard</span>
        </a>
        <a href="tools.html" class="sidebar-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
          <span>Ferramentas</span>
        </a>
        <a href="history.html" class="sidebar-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>Histórico</span>
        </a>
        <a href="profile.html" class="sidebar-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Perfil</span>
        </a>
        <a href="subscription.html" class="sidebar-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          <span>Assinatura</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button onclick="api.logout()" class="sidebar-link" style="width: 100%; border: none; background: none; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="page-header">
        <div class="section-label">Visão Geral</div>
        <h1>Bem-vindo ao NucleoTech</h1>
        <p>Gerencie suas ferramentas e acompanhe seu uso em tempo real.</p>
      </header>

      <div class="grid" id="dashboard-stats" style="margin-bottom: 4rem;">
        <div class="card">
          <div class="card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <p style="margin-bottom: 0.2rem;">Plano Atual</p>
          <h2 id="user-plan" style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--primary);">Carregando...</h2>
        </div>
        <div class="card">
          <div class="card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
          <p style="margin-bottom: 0.2rem;">Execuções Realizadas</p>
          <h2 id="usage-count" style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--accent-green);">0</h2>
        </div>
      </div>

      <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
          <h2 style="font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;">Ferramentas Recomendadas</h2>
          <a href="tools.html" class="btn btn-ghost btn-sm">Ver todas</a>
        </div>
        <div class="grid" id="tools-grid">
          <!-- Ferramentas serão renderizadas pelo JS -->
        </div>
      </section>
    </main>
  </div>

  <div id="notification-container"></div>

  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
