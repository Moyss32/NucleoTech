<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NucleoTech</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo">
                <img src="../assets/logo.png" alt="NucleoTech Logo" style="height: 24px;">
                NucleoTech
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link active">Dashboard</a>
                <a href="tools.html" class="sidebar-link">Ferramentas</a>
                <a href="history.html" class="sidebar-link">Histórico</a>
                <a href="profile.html" class="sidebar-link">Perfil</a>
                <a href="subscription.html" class="sidebar-link">Assinatura</a>
            </nav>
            <div style="margin-top: auto;">
                <button onclick="api.logout()" class="sidebar-link" style="width: 100%; text-align: left; background: none; border: none; cursor: pointer;">🚪 Sair</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>Bem-vindo ao NucleoTech</h1>
                <p>Gerencie suas ferramentas e acompanhe seu uso.</p>
            </header>

            <div class="grid" id="dashboard-stats" style="margin-bottom: 3rem;">
                <div class="card">
                    <p style="margin-bottom: 0.5rem;">Plano Atual</p>
                    <h2 id="user-plan">Carregando...</h2>
                </div>
                <div class="card">
                    <p style="margin-bottom: 0.5rem;">Execuções Realizadas</p>
                    <h2 id="usage-count">0</h2>
                </div>
            </div>

            <section>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.25rem;">Ferramentas Recomendadas</h2>
                    <a href="tools.html" style="color: var(--primary); font-size: 0.9rem; font-weight: 500;">Ver todas</a>
                </div>
                <div class="grid" id="tools-grid">
                    <!-- Ferramentas serão renderizadas pelo JS -->
                </div>
            </section>
        </main>
    </div>

    <div id="notification-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
