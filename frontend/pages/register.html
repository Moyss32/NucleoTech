<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — NucleoTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Syne:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(0, 112, 243, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(0, 200, 150, 0.1), transparent 40%),
                  var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 3rem;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .auth-header { text-align: center; margin-bottom: 2.5rem; }
    .auth-header h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    .auth-header p { color: var(--text-muted); }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.6rem; }
    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1.2rem;
      color: #fff;
      font-family: var(--font-body);
      transition: all var(--transition);
    }
    .form-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .auth-footer { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem; }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card glass-card">
    <div class="auth-header">
      <a href="home.html">
        <img src="../assets/logo.png" alt="NucleoTech Logo" style="height: 48px;">
      </a>
      <h1>Comece agora</h1>
      <p>Crie sua conta gratuita na NucleoTech</p>
    </div>
    
    <form id="register-form">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required placeholder="Escolha um nome de usuário">
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
        <span>Criar Conta</span>
      </button>
    </form>
    
    <div class="auth-footer">
      Já tem uma conta? <a href="login.html">Fazer login</a>
    </div>
  </div>

  <div id="notification-container"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
