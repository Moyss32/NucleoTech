<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - NucleoTech</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo">
                <div style="width: 24px; height: 24px; background: var(--primary); border-radius: 4px;"></div>
                NucleoTech
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">🏠 Dashboard</a>
                <a href="tools.html" class="sidebar-link">🛠️ Ferramentas</a>
                <a href="history.html" class="sidebar-link">📜 Histórico</a>
                <a href="profile.html" class="sidebar-link active">👤 Perfil</a>
                <a href="subscription.html" class="sidebar-link">💳 Assinatura</a>
            </nav>
            <div style="margin-top: auto;">
                <button onclick="api.logout()" class="sidebar-link" style="width: 100%; text-align: left; background: none; border: none; cursor: pointer;">🚪 Sair</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>Seu Perfil</h1>
                <p>Gerencie suas informações pessoais.</p>
            </header>

            <div class="card" style="max-width: 600px;" id="profile-info">
                <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
                    <div style="width: 80px; height: 80px; background: var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem;">👤</div>
                    <div>
                        <h2 id="profile-username">Carregando...</h2>
                        <p id="profile-email" style="color: var(--text-muted);">...</p>
                    </div>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <span style="color: var(--text-muted);">Plano Atual</span>
                        <span id="profile-plan" style="font-weight: 600;">...</span>
                    </div>
                    <button class="btn btn-outline" style="width: 100%;">Editar Perfil</button>
                </div>
            </div>
        </main>
    </div>

    <div id="notification-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
