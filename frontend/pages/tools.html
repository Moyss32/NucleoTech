<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentas - NucleoTech</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <div class="logo">NucleoTech</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="tools.html">Ferramentas</a>
            <a href="history.html">Histórico</a>
            <a href="#" id="logoutBtn">Sair</a>
        </div>
    </nav>

    <div class="container">
        <h1>Nossas Ferramentas</h1>

        <div class="card">
            <h2>Processamento de Imagens</h2>
            <form id="imageProcessingForm">
                <div class="form-group">
                    <label for="imageFile">Selecione uma imagem:</label>
                    <input type="file" id="imageFile" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label for="imageAction">Ação:</label>
                    <select id="imageAction" required>
                        <option value="convert">Converter Imagem</option>
                        <option value="remove_bg">Remover Fundo</option>
                        <option value="upscale">Upscale (1.5x)</option>
                        <option value="thumbnail">Gerar Thumbnail</option>
                    </select>
                </div>
                <div class="form-group" id="imageFormatGroup" style="display: none;">
                    <label for="imageFormat">Formato de Saída:</label>
                    <select id="imageFormat">
                        <option value="PNG">PNG</option>
                        <option value="JPG">JPG</option>
                        <option value="WEBP">WEBP</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Processar Imagem</button>
            </form>
            <div id="imageResult" style="margin-top: 1rem;"></div>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <h2>Processamento de Áudio</h2>
            <form id="audioProcessingForm">
                <div class="form-group">
                    <label for="audioFile">Selecione um arquivo de áudio:</label>
                    <input type="file" id="audioFile" accept="audio/*" required>
                </div>
                <div class="form-group">
                    <label for="audioFormat">Formato de Saída:</label>
                    <select id="audioFormat" required>
                        <option value="MP3">MP3</option>
                        <option value="WAV">WAV</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Processar Áudio</button>
            </form>
            <div id="audioResult" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <script type="module">
        import auth from "../js/auth.js";
        import processing from "../js/processing.js";

        if (!auth.isAuthenticated()) {
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", (e) => {
            e.preventDefault();
            auth.logout();
        });

        const imageActionSelect = document.getElementById("imageAction");
        const imageFormatGroup = document.getElementById("imageFormatGroup");

        imageActionSelect.addEventListener("change", () => {
            if (imageActionSelect.value === "convert") {
                imageFormatGroup.style.display = "block";
            } else {
                imageFormatGroup.style.display = "none";
            }
        });

        document.getElementById("imageProcessingForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const imageFile = document.getElementById("imageFile").files[0];
            const imageAction = document.getElementById("imageAction").value;
            const imageFormat = document.getElementById("imageFormat").value;
            const imageResultDiv = document.getElementById("imageResult");

            imageResultDiv.innerHTML = "> Processando... <";

            const result = await processing.processImage(imageAction, imageFile, imageFormat);
            if (result.success) {
                imageResultDiv.innerHTML = `<p>Sucesso! <a href="${result.result_url}" target="_blank">Baixar Resultado</a></p>`;
            } else {
                imageResultDiv.innerHTML = `<p style="color: red;">Erro: ${result.error}</p>`;
            }
        });

        document.getElementById("audioProcessingForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const audioFile = document.getElementById("audioFile").files[0];
            const audioFormat = document.getElementById("audioFormat").value;
            const audioResultDiv = document.getElementById("audioResult");

            audioResultDiv.innerHTML = "> Processando... <";

            const result = await processing.processAudio("convert", audioFile, audioFormat);
            if (result.success) {
                audioResultDiv.innerHTML = `<p>Sucesso! <a href="${result.result_url}" target="_blank">Baixar Resultado</a></p>`;
            } else {
                audioResultDiv.innerHTML = `<p style="color: red;">Erro: ${result.error}</p>`;
            }
        });
    </script>
</body>
</html>
